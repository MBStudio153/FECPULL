name: fred-healthprice1
on: workflow_dispatch
permissions:
  contents: read
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - name: FRED API, health care prices (physician and dental services, drugs, equipment, insurance, producer prices for drugs), plus ID searches
        run: |
          mkdir -p out
          cat > q.py <<'PY'
          import json, os, time, urllib.parse, urllib.request
          fk = os.environ["FRED_API_KEY"]
          log = open("out/log.txt", "w")
          if not fk: log.write("FRED_API_KEY secret is empty\n"); log.flush()
          def get(path, **q):
              q.update(api_key=fk, file_type="json")
              url = "https://api.stlouisfed.org/fred/" + path + "?" + urllib.parse.urlencode(q)
              for a in range(3):
                  try:
                      return urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "kaim-research/1.0"}), timeout=120).read().decode()
                  except Exception as e:
                      log.write("%s %s attempt %d %r\n" % (path, q.get("series_id") or q.get("search_text"), a, e)); log.flush(); time.sleep(4)
              return None
          # candidates; every ID that works is saved, so a wrong guess costs nothing
          ids = [
              "CUSR0000SEMC01", "CUUR0000SEMC01",   # physicians' services
              "CUSR0000SEMC02", "CUUR0000SEMC02",   # dental services
              "CUSR0000SEMC", "CUUR0000SEMC",       # professional medical services
              "CUSR0000SEMF", "CUUR0000SEMF",       # medicinal drugs
              "CUSR0000SEMF01", "CUUR0000SEMF01",   # prescription drugs
              "CUSR0000SEMF02", "CUUR0000SEMF02",   # nonprescription drugs
              "CUSR0000SEMG", "CUUR0000SEMG",       # medical equipment and supplies
              "CUSR0000SEME", "CUUR0000SEME",       # health insurance
              "CUSR0000SEMD01", "CUUR0000SEMD01",   # hospital services
              "WPU0511", "PCU325412325412",         # producer prices: pharmaceutical preparations
              "WPUSI07101", "WPU051102", "WPU051101", "WPU05110201", # producer price drug indexes (guesses)
              "WPUFD49207",
              "PCU6215116215111", "PCU621111621111", "PCU622110622110", "PCU621210621210",
              "CPIEMEDCARE",
          ]
          for sid in ids:
              txt = get("series/observations", series_id=sid)
              meta = get("series", series_id=sid)
              if txt:
                  open("out/fred_%s.json" % sid, "w").write(txt)
                  title = units = ""
                  try:
                      m = json.loads(meta)["seriess"][0]; title = m["title"]; units = m.get("units_short", "")
                  except Exception: pass
                  obs = [o for o in json.loads(txt)["observations"] if o["value"] != "."]
                  log.write("OK   %s  %d obs  %s to %s  %s  [%s]\n" % (sid, len(obs), obs[0]["date"] if obs else "-", obs[-1]["date"] if obs else "-", title, units)); log.flush()
              else:
                  log.write("FAIL %s\n" % sid); log.flush()
          texts = ["consumer price index physicians services", "consumer price index prescription drugs", "consumer price index health insurance",
                   "producer price index pharmaceutical preparations", "producer price index prescription drugs brand generic",
                   "producer price index general medical and surgical hospitals", "producer price index offices of physicians",
                   "consumer price index nonprescription drugs", "consumer price index dental services"]
          for text in texts:
              s = get("series/search", search_text=text, limit=25, order_by="popularity", sort_order="desc")
              if s:
                  try:
                      for r in json.loads(s)["seriess"]:
                          log.write("SEARCH %s | %s | %s | %s | %s to %s\n" % (text, r["id"], r["title"], r.get("units_short"), r.get("observation_start"), r.get("observation_end")))
                  except Exception as e:
                      log.write("search parse %r\n" % e)
              log.flush()
          log.close()
          PY
          python3 q.py
          grep -E "^(OK|FAIL)" out/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fred-healthprice1
          path: out/
          retention-days: 3

