name: fred-healthprice2
on: workflow_dispatch
permissions:
  contents: read
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - name: FRED API, BEA personal consumption expenditure price indexes for health care (physicians, dental, hospitals, drugs, insurance), plus ID searches
        run: |
          mkdir -p out
          cat > q.py <<'PY'
          import json, os, time, urllib.parse, urllib.request
          fk = os.environ["FRED_API_KEY"]
          log = open("out/log.txt", "w")
          if not fk: log.write("FRED_API_KEY secret is empty\n"); log.flush()
          def get(path, **q):
              q.update(api_key=fk, file_type="json")
              url = "https://api.stlouisfed.org/fred/" + path + "?" + urllib.parse.urlencode(q)
              for a in range(3):
                  try:
                      return urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "kaim-research/1.0"}), timeout=120).read().decode()
                  except Exception as e:
                      log.write("%s %s attempt %d %r\n" % (path, q.get("series_id") or q.get("search_text"), a, e)); log.flush(); time.sleep(4)
              return None
          # candidates; every ID that works is saved, so a wrong guess costs nothing
          ids = [
              "DPHYRG3A086NBEA", "DDENRG3A086NBEA", "DHINRG3A086NBEA", "DMINRG3A086NBEA",   # BEA PCE price indexes: physicians, dental, net health insurance
              "DHOSRG3A086NBEA", "DPHMRG3A086NBEA", "DPREDG3A086NBEA", "DDRGRG3A086NBEA",   # guesses: hospitals, pharmaceutical products, prescription drugs
              "DNURRG3A086NBEA", "DHLCRG3A086NBEA", "DMEDRG3A086NBEA",                      # guesses: nursing homes, health care, medical services
              "HLTHSCPCHCSA", "DHCERG3M086SBEA",                                           # health care price index guesses
          ]
          for sid in ids:
              txt = get("series/observations", series_id=sid)
              meta = get("series", series_id=sid)
              if txt:
                  open("out/fred_%s.json" % sid, "w").write(txt)
                  title = units = ""
                  try:
                      m = json.loads(meta)["seriess"][0]; title = m["title"]; units = m.get("units_short", "")
                  except Exception: pass
                  obs = [o for o in json.loads(txt)["observations"] if o["value"] != "."]
                  log.write("OK   %s  %d obs  %s to %s  %s  [%s]\n" % (sid, len(obs), obs[0]["date"] if obs else "-", obs[-1]["date"] if obs else "-", title, units)); log.flush()
              else:
                  log.write("FAIL %s\n" % sid); log.flush()
          texts = ["personal consumption expenditures prescription drugs price index", "personal consumption expenditures pharmaceutical and other medical products price index",
                   "personal consumption expenditures hospitals price index", "personal consumption expenditures nursing homes price index",
                   "personal consumption expenditures health care price index", "personal consumption expenditures medical services price index",
                   "personal consumption expenditures nonprescription drugs price index", "personal consumption expenditures generic drugs"]
          for text in texts:
              s = get("series/search", search_text=text, limit=25, order_by="popularity", sort_order="desc")
              if s:
                  try:
                      for r in json.loads(s)["seriess"]:
                          log.write("SEARCH %s | %s | %s | %s | %s to %s\n" % (text, r["id"], r["title"], r.get("units_short"), r.get("observation_start"), r.get("observation_end")))
                  except Exception as e:
                      log.write("search parse %r\n" % e)
              log.flush()
          log.close()
          PY
          python3 q.py
          grep -E "^(OK|FAIL)" out/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fred-healthprice2
          path: out/
          retention-days: 3

