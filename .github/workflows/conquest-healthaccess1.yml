name: conquest-healthaccess1
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Health coverage and cost (Census SAHIE, FRED, World Bank)
        run: |
          mkdir -p out
          cat > q.py <<'PY'
          import time, urllib.request, json
          UA = {"User-Agent": "kaim-research/1.0"}
          log = open("out/log.txt", "w")
          U = {
            "sahie_us_2008.json": "https://api.census.gov/data/timeseries/healthins/sahie?get=NAME,PCTUI_PT,NUI_PT,NIPR_PT&for=us:*&time=2008",
            "sahie_us_2009.json": "https://api.census.gov/data/timeseries/healthins/sahie?get=NAME,PCTUI_PT,NUI_PT,NIPR_PT&for=us:*&time=2009",
            "sahie_us_2010.json": "https://api.census.gov/data/timeseries/healthins/sahie?get=NAME,PCTUI_PT,NUI_PT,NIPR_PT&for=us:*&time=2010",
            "sahie_us_2011.json": "https://api.census.gov/data/timeseries/healthins/sahie?get=NAME,PCTUI_PT,NUI_PT,NIPR_PT&for=us:*&time=2011",
            "sahie_us_2012.json": "https://api.census.gov/data/timeseries/healthins/sahie?get=NAME,PCTUI_PT,NUI_PT,NIPR_PT&for=us:*&time=2012",
            "sahie_us_2013.json": "https://api.census.gov/data/timeseries/healthins/sahie?get=NAME,PCTUI_PT,NUI_PT,NIPR_PT&for=us:*&time=2013",
            "sahie_us_2014.json": "https://api.census.gov/data/timeseries/healthins/sahie?get=NAME,PCTUI_PT,NUI_PT,NIPR_PT&for=us:*&time=2014",
            "sahie_us_2015.json": "https://api.census.gov/data/timeseries/healthins/sahie?get=NAME,PCTUI_PT,NUI_PT,NIPR_PT&for=us:*&time=2015",
            "sahie_us_2016.json": "https://api.census.gov/data/timeseries/healthins/sahie?get=NAME,PCTUI_PT,NUI_PT,NIPR_PT&for=us:*&time=2016",
            "sahie_us_2017.json": "https://api.census.gov/data/timeseries/healthins/sahie?get=NAME,PCTUI_PT,NUI_PT,NIPR_PT&for=us:*&time=2017",
            "sahie_us_2018.json": "https://api.census.gov/data/timeseries/healthins/sahie?get=NAME,PCTUI_PT,NUI_PT,NIPR_PT&for=us:*&time=2018",
            "sahie_us_2019.json": "https://api.census.gov/data/timeseries/healthins/sahie?get=NAME,PCTUI_PT,NUI_PT,NIPR_PT&for=us:*&time=2019",
            "sahie_us_2020.json": "https://api.census.gov/data/timeseries/healthins/sahie?get=NAME,PCTUI_PT,NUI_PT,NIPR_PT&for=us:*&time=2020",
            "sahie_us_2021.json": "https://api.census.gov/data/timeseries/healthins/sahie?get=NAME,PCTUI_PT,NUI_PT,NIPR_PT&for=us:*&time=2021",
            "sahie_us_2022.json": "https://api.census.gov/data/timeseries/healthins/sahie?get=NAME,PCTUI_PT,NUI_PT,NIPR_PT&for=us:*&time=2022",
            "sahie_us_2023.json": "https://api.census.gov/data/timeseries/healthins/sahie?get=NAME,PCTUI_PT,NUI_PT,NIPR_PT&for=us:*&time=2023",
            "fred_CUSR0000SAM.csv": "https://fred.stlouisfed.org/graph/fredgraph.csv?id=CUSR0000SAM&cosd=1947-01-01",
            "fred_CUSR0000SEMD01.csv": "https://fred.stlouisfed.org/graph/fredgraph.csv?id=CUSR0000SEMD01&cosd=1947-01-01",
            "fred_CUSR0000SEME.csv": "https://fred.stlouisfed.org/graph/fredgraph.csv?id=CUSR0000SEME&cosd=1947-01-01",
            "fred_CUSR0000SAM1.csv": "https://fred.stlouisfed.org/graph/fredgraph.csv?id=CUSR0000SAM1&cosd=1947-01-01",
            "fred_CUSR0000SEMF01.csv": "https://fred.stlouisfed.org/graph/fredgraph.csv?id=CUSR0000SEMF01&cosd=1947-01-01",
            "fred_HLTHSCPCHCSA.csv": "https://fred.stlouisfed.org/graph/fredgraph.csv?id=HLTHSCPCHCSA&cosd=1947-01-01",
            "wdi_health_exp_gdp.json": "https://api.worldbank.org/v2/country/all/indicator/SH.XPD.CHEX.GD.ZS?format=json&per_page=20000&date=1960:2025",
            "wdi_oop_health.json": "https://api.worldbank.org/v2/country/all/indicator/SH.XPD.OOPC.CH.ZS?format=json&per_page=20000&date=1960:2025"
          }
          for fn, u in U.items():
              for a in range(4):
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=180).read()
                      open("out/" + fn, "wb").write(r)
                      log.write("%s ok %d bytes\n" % (fn, len(r))); break
                  except Exception as e:
                      log.write("%s attempt %d %s\n" % (fn, a, repr(e)[:120])); time.sleep(10 * (a + 1))
              log.flush(); time.sleep(1)
          PY
          python3 q.py || true
          ls -la out
          cat out/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conquest-healthaccess1
          path: out/

