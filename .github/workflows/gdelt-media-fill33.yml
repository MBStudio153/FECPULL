name: gdelt-media-fill3
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: [{"term": "kittens", "tag": "a", "grp": "media", "years": "2022,2023,2024,2025,2026"}, {"term": "puppy", "tag": "a", "grp": "media", "years": "2017,2023,2024,2025,2026"}, {"term": "cats", "tag": "a", "grp": "media", "years": "2017,2018,2019,2020,2021"}, {"term": "cats", "tag": "b", "grp": "media", "years": "2022,2023,2024,2025,2026"}, {"term": "dogs", "tag": "a", "grp": "media", "years": "2017,2018,2019,2020,2021"}, {"term": "dogs", "tag": "b", "grp": "media", "years": "2022,2023,2024,2025,2026"}]
    steps:
      - name: GDELT DOC API, animal terms, missing years only, one job at a time
        continue-on-error: true
        env:
          TERM_: ${{ matrix.term }}
          YEARS_: ${{ matrix.years }}
          GRP_: ${{ matrix.grp }}
        run: |
          mkdir -p out
          cat > q.py <<'PY'
          import os, re, time, urllib.request, urllib.parse
          term = os.environ["TERM_"]
          slug = re.sub("[^a-z0-9]+", "_", term.lower()).strip("_")
          log = open("out/log.txt", "w")
          q = '"%s" sourcelang:english' % term
          for yr in [int(y) for y in os.environ["YEARS_"].split(",")]:
              start = "%d0101000000" % yr
              end = time.strftime("%Y%m%d235959") if yr >= 2026 else "%d1231235959" % yr
              params = {"query": q, "mode": "timelinevolraw", "format": "json", "timelinesmooth": "0", "startdatetime": start, "enddatetime": end}
              url = "https://api.gdeltproject.org/api/v2/doc/doc?" + urllib.parse.urlencode(params)
              err = ""
              for a in range(10):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "kaim-research/1.0"})
                      r = urllib.request.urlopen(req, timeout=180).read().decode("utf-8", "replace")
                      if r.startswith("{"):
                          open("out/topic_%s__%s_%d.json" % (os.environ["GRP_"], slug, yr), "w").write(r)
                          log.write("%s %d ok len=%d\n" % (slug, yr, len(r))); log.flush()
                          break
                      err = r[:80]
                      if "too short" in r or "too long" in r:
                          log.write("%s %d STOP phrase rejected: %s\n" % (slug, yr, err)); log.flush()
                          raise SystemExit(1)
                  except SystemExit:
                      raise
                  except Exception as e:
                      err = repr(e)[:120]
                  log.write("%s %d attempt %d %s\n" % (slug, yr, a, err)); log.flush()
                  time.sleep(240)
              time.sleep(60)
          log.close()
          PY
          python3 q.py
      - name: Name the artifact
        if: always()
        run: echo "ART=${TERM_}_${TAG_}" >> $GITHUB_ENV
        env:
          TERM_: ${{ matrix.term }}
          TAG_: ${{ matrix.tag }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdelt-mediafill3-${{ env.ART }}
          path: out/

