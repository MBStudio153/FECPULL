name: cancer-data2
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: CDC chronic disease indicators (cancer), NCHS malignant neoplasm death rates, PLACES county cancer measures
        run: |
          mkdir -p out
          cat > q.py <<'PY'
          import json, time, urllib.parse, urllib.request
          UA = {"User-Agent": "kaim-research/1.0"}
          log = open("out/log.txt", "w")
          def L(s): log.write(s + "\n"); log.flush()
          def http(u, tries=4):
              for a in range(tries):
                  try:
                      return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=180).read()
                  except Exception as e:
                      L("  %s ERROR %s" % (u[:130], str(e)[:100])); time.sleep(8 * (a + 1))
          def pull(ds, where, name):
              rows = []; off = 0
              while True:
                  q = {"$limit": 50000, "$offset": off}
                  if where: q["$where"] = where
                  r = http("https://data.cdc.gov/resource/%s.json?%s" % (ds, urllib.parse.urlencode(q)))
                  if not r: break
                  d = json.loads(r); rows += d
                  if len(d) < 50000: break
                  off += 50000; time.sleep(2)
              open("out/cdc_%s.json" % name, "w").write(json.dumps(rows)); L("%s rows %d" % (name, len(rows)))
          pull("hksd-2xuw", "topic like '%Cancer%'", "hksd-2xuw_cancer")
          pull("h3hw-hzvg", None, "h3hw-hzvg")
          pull("9dzk-mvmi", None, "9dzk-mvmi")
          pull("swc5-untb", "measureid in ('CANCER','MAMMOUSE','COLON_SCREEN','CERVICAL')", "places_county2025_cancer")
          pull("d3i6-k6z5", None, "places_county2024_gis")
          PY
          python3 q.py || true
          ls -la out
          tail -30 out/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cancer-data2
          path: out/

