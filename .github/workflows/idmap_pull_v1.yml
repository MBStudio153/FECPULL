  pull:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: idmap-inputs
          path: idmap
      - name: Pull chunk ${{ matrix.chunk }} of 6
        run: python idmap/idmap_pull_v1.py --leis idmap/leis.csv --chunk ${{ matrix.chunk }} --of 6 --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idmap-chunk-${{ matrix.chunk }}
          path: out/
          if-no-files-found: ignore

  combine:
    needs: pull
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: idmap-chunk-*
          merge-multiple: true
          path: all
      - name: Stack chunks
        run: |
          cd all
          first=$(ls id_map_*.csv | head -1)
          head -1 "$first" > id_map.csv
          for f in id_map_*.csv; do tail -n +2 "$f" >> id_map.csv; done
          head -1 "$(ls id_all_figi_*.csv | head -1)" > id_all_figi.csv
          for f in id_all_figi_*.csv; do tail -n +2 "$f" >> id_all_figi.csv; done
          wc -l id_map.csv id_all_figi.csv
      - uses: actions/upload-artifact@v4
        with:
          name: id-map
          path: |
            all/id_map.csv
            all/id_all_figi.csv
            all/idmap_*_log.txt

