# idmap_pull_v1.yml - ONE-FILE workflow: LEI -> ISIN -> ticker map for the 384 ESEF pilot companies.
# Save it in your repo as:  .github/workflows/idmap_pull_v1.yml
# Then: Actions tab > "ID map pull v1" > Run workflow. No inputs, no other files needed.
#
# Sources (free, no keys): GLEIF (LEI records and linked ISINs) and OpenFIGI (ISIN to ticker).
# 6 small jobs start at the same time (about 10-15 minutes each), then one job stacks them.
# Download "id-map" and send it back: id_map.csv is the file that goes into the workbook's ID Map sheet.

name: ID map pull v1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write script and company list
        run: |
          mkdir -p idmap
          cat > idmap/idmap_pull_v1.py <<'PYEOF'
          #!/usr/bin/env python3
          """
          idmap_pull_v1.py - identifier map for the ESEF pilot companies: LEI -> ISIN -> ticker.

          Standard library only. Two free public sources, no API keys:
            GLEIF  (api.gleif.org)      LEI record (legal name, country) and the ISINs linked to each LEI
            OpenFIGI (api.openfigi.com) ISIN -> ticker, exchange code, security type

          Usage: python idmap_pull_v1.py --leis leis.csv --chunk 1 --of 4 --out out

          Output (one row per LEI, same columns in every chunk so chunks can be stacked):
            id_map_<chunk>.csv        lei,country,name,gleif_name,isin,ticker,exch_code,figi,security_type,name_figi,confidence,n_isins,n_checked,notes
            id_all_figi_<chunk>.csv   every FIGI row found (for review)
            idmap_<chunk>_log.txt     requests and errors

          Choice rule for the main security of a company: among FIGI rows of type 'Common Stock', prefer
          the exchange code typical for the company's country, else the first; if no common stock, the
          first 'Depositary Receipt' or any row, with confidence 'low'. ISINs per LEI are capped (--max-isins)
          because banks and large issuers carry thousands of bond ISINs; a note says when the cap applied.
          Review before relying on a row: confidence 'high' = common stock on the home exchange.
          """
          import argparse, csv, json, os, sys, time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote

          UA = "KAIM-Research-ID-map (research use)"
          HOME_EXCH = {"FR": "FP", "SE": "SS", "GB": "LN", "NL": "NA", "DK": "DC", "FI": "FH", "NO": "NO", "BE": "BB", "AT": "AV",
                       "IT": "IM", "ES": "SM", "GR": "GA", "PL": "PW", "HU": "HB", "IS": "IR", "LU": "LX", "DE": "GR", "IE": "ID"}
          FIELDS = ["lei", "country", "name", "gleif_name", "isin", "ticker", "exch_code", "figi", "security_type", "name_figi",
                    "confidence", "n_isins", "n_checked", "notes"]


          def http(url, log, data=None, tries=5, headers=None):
              delay = 3.0
              for i in range(tries):
                  try:
                      h = {"User-Agent": UA, "Accept": "application/json"}
                      if data is not None:
                          h["Content-Type"] = "application/json"
                      if headers:
                          h.update(headers)
                      with urlopen(Request(url, data=data, headers=h), timeout=90) as r:
                          return json.loads(r.read())
                  except HTTPError as e:
                      log.write("HTTP %s %s\n" % (e.code, url[:140]))
                      if e.code in (400, 404):
                          return None
                      if e.code == 429:
                          time.sleep(max(delay, 20)); delay *= 2; continue
                  except (URLError, TimeoutError, ConnectionError, ValueError) as e:
                      log.write("ERR %s %s\n" % (e, url[:140]))
                  time.sleep(delay); delay *= 2
              return None


          def gleif(lei, log, max_isins):
              rec = http("https://api.gleif.org/api/v1/lei-records/%s" % quote(lei), log)
              name = ""
              if rec and rec.get("data"):
                  name = (((rec["data"].get("attributes") or {}).get("entity") or {}).get("legalName") or {}).get("name", "")
              isins, page = [], 1
              while True:
                  d = http("https://api.gleif.org/api/v1/lei-records/%s/isins?page%%5Bsize%%5D=200&page%%5Bnumber%%5D=%d" % (quote(lei), page), log)
                  if not d or not d.get("data"):
                      break
                  isins += [x["attributes"]["isin"] for x in d["data"] if x.get("attributes", {}).get("isin")]
                  last = ((d.get("meta") or {}).get("pagination") or {}).get("lastPage", 1)
                  if page >= last or len(isins) >= max_isins * 5:
                      break
                  page += 1
                  time.sleep(1.1)
              return name, isins


          def order_isins(isins, country):
              """Home-country ISINs first (equity is usually under the home prefix), then the rest."""
              home = [i for i in isins if i[:2] == country]
              rest = [i for i in isins if i[:2] != country]
              return home + rest


          def parse_figi(resp, isins):
              """resp is a list aligned with the request jobs; each item {'data':[...]} or {'warning':..}."""
              rows = []
              for isin, item in zip(isins, resp or []):
                  for d in (item or {}).get("data", []) or []:
                      rows.append({"isin": isin, "ticker": d.get("ticker", ""), "exch_code": d.get("exchCode", ""), "figi": d.get("figi", ""),
                                   "security_type": d.get("securityType2") or d.get("securityType", ""), "name_figi": d.get("name", "")})
              return rows


          def figi(isins, log):
              out = []
              for i in range(0, len(isins), 10):
                  part = isins[i:i + 10]
                  body = json.dumps([{"idType": "ID_ISIN", "idValue": x} for x in part]).encode()
                  resp = http("https://api.openfigi.com/v3/mapping", log, data=body)
                  out += parse_figi(resp, part)
                  time.sleep(2.6)          # unauthenticated limit is about 25 requests per minute
              return out


          def choose(rows, country):
              cs = [r for r in rows if r["security_type"] == "Common Stock"]
              home = HOME_EXCH.get(country, "")
              for r in cs:
                  if r["exch_code"] == home:
                      return r, "high"
              if cs:
                  return cs[0], "medium"
              dr = [r for r in rows if "Depositary" in r["security_type"]]
              if dr:
                  return dr[0], "low"
              return (rows[0], "low") if rows else (None, "")


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--leis", required=True); ap.add_argument("--chunk", type=int, default=1); ap.add_argument("--of", type=int, default=1)
              ap.add_argument("--out", default="idmap_out"); ap.add_argument("--max-isins", type=int, default=25)
              a = ap.parse_args()
              os.makedirs(a.out, exist_ok=True)
              todo = list(csv.DictReader(open(a.leis, encoding="utf-8")))
              todo = [r for i, r in enumerate(todo) if i % a.of == a.chunk - 1]
              log = open(os.path.join(a.out, "idmap_%d_log.txt" % a.chunk), "w")
              fo = open(os.path.join(a.out, "id_map_%d.csv" % a.chunk), "w", newline="", encoding="utf-8")
              fa = open(os.path.join(a.out, "id_all_figi_%d.csv" % a.chunk), "w", newline="", encoding="utf-8")
              w = csv.DictWriter(fo, fieldnames=FIELDS); w.writeheader()
              wa = csv.DictWriter(fa, fieldnames=["lei", "isin", "ticker", "exch_code", "figi", "security_type", "name_figi"]); wa.writeheader()
              for n, r in enumerate(todo, 1):
                  lei, ctry = r["lei"], r["country"]
                  gname, isins = gleif(lei, log, a.max_isins)
                  ordered = order_isins(isins, ctry)[: a.max_isins]
                  rows = figi(ordered, log) if ordered else []
                  for x in rows:
                      wa.writerow({"lei": lei, **x})
                  pick, conf = choose(rows, ctry)
                  notes = []
                  if not isins: notes.append("no ISIN on GLEIF")
                  if len(isins) > a.max_isins: notes.append("ISIN list capped at %d of %d" % (a.max_isins, len(isins)))
                  if isins and not rows: notes.append("ISINs found but no FIGI match")
                  w.writerow({"lei": lei, "country": ctry, "name": r["name"], "gleif_name": gname,
                              "isin": pick["isin"] if pick else "", "ticker": pick["ticker"] if pick else "",
                              "exch_code": pick["exch_code"] if pick else "", "figi": pick["figi"] if pick else "",
                              "security_type": pick["security_type"] if pick else "", "name_figi": pick["name_figi"] if pick else "",
                              "confidence": conf, "n_isins": len(isins), "n_checked": len(ordered), "notes": "; ".join(notes)})
                  fo.flush(); fa.flush()
                  if n % 10 == 0:
                      print("chunk %d: %d/%d" % (a.chunk, n, len(todo)), flush=True)
              print("chunk %d done: %d companies" % (a.chunk, len(todo)))


          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          cat > idmap/leis.csv <<'LEIEOF'
