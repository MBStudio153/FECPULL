name: tariff-data6
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Census monthly imports and duties, denim and jeans
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          mkdir -p out
          cat > t.py <<'PY'
          import os, time, urllib.parse, urllib.request
          UA = {"User-Agent": "kaim-research/1.0 (info@kaimresearch.com)"}
          B = "https://api.census.gov/data/timeseries/intltrade/imports/hs"
          log = open("out/log.txt", "w")
          key = os.environ.get("CENSUS_API_KEY", "")
          def get(url, tries=4):
              err = ""
              for a in range(tries):
                  try:
                      return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=180).read().decode("utf-8", "replace")
                  except Exception as e:
                      err = repr(e)[:150]; time.sleep(8 * (a + 1))
              return "ERROR " + err
          def save(name, p):
              if key: p["key"] = key
              r = get(B + "?" + urllib.parse.urlencode(p))
              open("out/" + name, "w").write(r)
              log.write("%s len=%d %s\n" % (name, len(r), r[:70].replace("\n", " "))); log.flush(); time.sleep(2)
          open("out/variables.json", "w").write(get(B + "/variables.json"))
          for ch in ["520942", "521142", "620342", "620462", "610342", "610462"]:
              save("monthly_hs6_%s_total.json" % ch, {"get": "GEN_VAL_MO,CON_VAL_MO,CAL_DUT_MO,I_COMMODITY,I_COMMODITY_LDESC", "COMM_LVL": "HS6", "I_COMMODITY": ch, "CTY_CODE": "-", "time": "from 2013-01 to 2026-09"})
          PY
          python3 t.py
          tail -15 out/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tariff-data6
          path: out/

