#!/usr/bin/env python3
"""Download every artifact of one GitHub Actions run, at once.

Usage:
  export GH_TOKEN=<token with Actions: read on the repo>   # a fine-grained or classic token
  python3 download_run_artifacts.py 45197438196
  python3 download_run_artifacts.py 45197438196 --repo MBStudio153/FECPULL --out artifacts --workers 6

Artifacts download even for public repositories only with a token. Files already
downloaded are skipped, so you can rerun it after an interruption.
"""
import argparse, json, os, sys, urllib.request, urllib.error
from concurrent.futures import ThreadPoolExecutor, as_completed

ap = argparse.ArgumentParser()
ap.add_argument("run_id")
ap.add_argument("--repo", default="MBStudio153/FECPULL")
ap.add_argument("--out", default="artifacts")
ap.add_argument("--workers", type=int, default=6)
ap.add_argument("--unzip", action="store_true", help="also unzip each artifact into its own folder")
a = ap.parse_args()
tok = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN")
if not tok:
    sys.exit("Set GH_TOKEN first (export GH_TOKEN=...).")
H = {"Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}

def get(url):
    return urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=120)

arts, page = [], 1
while True:
    url = f"https://api.github.com/repos/{a.repo}/actions/runs/{a.run_id}/artifacts?per_page=100&page={page}"
    d = json.load(get(url))
    arts += d["artifacts"]
    if len(arts) >= d["total_count"] or not d["artifacts"]:
        break
    page += 1
print(f"{len(arts)} artifacts in run {a.run_id}")
os.makedirs(a.out, exist_ok=True)

def grab(x):
    dest = os.path.join(a.out, x["name"] + ".zip")
    if os.path.exists(dest) and os.path.getsize(dest) > 0:
        return x["name"], "skipped (already there)"
    if x.get("expired"):
        return x["name"], "EXPIRED"
    try:
        r = get(x["archive_download_url"])        # redirects to a signed link
        tmp = dest + ".part"
        with open(tmp, "wb") as f:
            while True:
                b = r.read(1 << 20)
                if not b:
                    break
                f.write(b)
        os.replace(tmp, dest)
        if a.unzip:
            import zipfile
            with zipfile.ZipFile(dest) as z:
                z.extractall(os.path.join(a.out, x["name"]))
        return x["name"], "ok"
    except Exception as e:
        return x["name"], f"FAILED {e}"

bad = 0
with ThreadPoolExecutor(a.workers) as ex:
    for fut in as_completed([ex.submit(grab, x) for x in arts]):
        n, s = fut.result()
        if s.startswith(("FAILED", "EXPIRED")):
            bad += 1
        print(f"{n}: {s}")
print(f"done, {len(arts) - bad} ok, {bad} problems, files in ./{a.out}")

