name: nass-animals-api3
on: workflow_dispatch
permissions:
  contents: read
jobs:
  animals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        species: [HOGS, CATTLE, SHEEP, HORSES, CHICKENS, TURKEYS]
    steps:
      - name: NASS Quick Stats API, rows for one species whose description mentions death, loss or mortality
        env:
          NASS_KEY: ${{ secrets.NASS_API_KEY }}
          SPECIES: ${{ matrix.species }}
        run: |
          mkdir -p out
          cat > q.py <<'PY'
          import collections, json, os, time, urllib.parse, urllib.request
          key = os.environ["NASS_KEY"]; sp = os.environ["SPECIES"]
          log = open("out/log.txt", "w"); rows = []; seen = set()
          def call(ep, q):
              url = "https://quickstats.nass.usda.gov/api/%s/?" % ep + urllib.parse.urlencode(q)
              for a in range(3):
                  try:
                      return json.loads(urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "kaim-research/1.0"}), timeout=120).read().decode())
                  except Exception as e:
                      log.write("%s %s attempt %d %r\n" % (ep, q.get("short_desc__LIKE"), a, e)); log.flush(); time.sleep(6)
              return None
          # also list every statistic category this species has, so we can see what exists
          for yr in ("2024",):
              d = call("get_param_values", {"key": key, "param": "statisticcat_desc", "commodity_desc": sp, "sector_desc": "ANIMALS & PRODUCTS"})
              log.write("statisticcat values for %s: %r\n" % (sp, d)); log.flush()
          for w in ("DEATH", "LOSS", "LOST", "MORTAL"):
              base = {"key": key, "commodity_desc": sp, "short_desc__LIKE": w, "format": "JSON"}
              log.write("%s counts: %r\n" % (w, call("get_counts", base))); log.flush()
              for y0, y1 in ((1900, 1979), (1980, 1999), (2000, 2014), (2015, 2026)):
                  q = dict(base); q["year__GE"] = str(y0); q["year__LE"] = str(y1)
                  d = call("api_GET", q); data = (d or {}).get("data", [])
                  for r in data:
                      k = (r.get("short_desc"), r.get("year"), r.get("state_alpha"), r.get("agg_level_desc"), r.get("reference_period_desc"), r.get("domaincat_desc"), r.get("Value"))
                      if k not in seen: seen.add(k); rows.append(r)
                  log.write("%s %d-%d: %d rows\n" % (w, y0, y1, len(data))); log.flush()
                  time.sleep(1)
          json.dump(rows, open("out/nass_%s_loss.json" % sp.lower(), "w"))
          log.write("total %d unique rows\n" % len(rows))
          for k, v in collections.Counter(r.get("short_desc") for r in rows).most_common(60): log.write("%6d  %s\n" % (v, k))
          PY
          python3 q.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nass-api-animals3-${{ matrix.species }}
          path: out/

