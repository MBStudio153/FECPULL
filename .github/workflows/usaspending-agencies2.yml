name: usaspending-agencies2
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: USAspending grant dollars by year, eight more agencies
        run: |
          mkdir -p out
          cat > q.py <<'PY'
          import json, time, urllib.request
          UA = {"User-Agent": "kaim-research/1.0", "Content-Type": "application/json"}
          log = open("out/log.txt", "w")
          AG = [("environmental_protection_agency", {"type": "awarding", "tier": "toptier", "name": "Environmental Protection Agency"}), ("national_endowment_for_the_humanities", {"type": "awarding", "tier": "toptier", "name": "National Endowment for the Humanities"}), ("centers_for_disease_control_and_prevention", {"type": "awarding", "tier": "subtier", "name": "Centers for Disease Control and Prevention", "toptier_name": "Department of Health and Human Services"}), ("national_oceanic_and_atmospheric_administration", {"type": "awarding", "tier": "subtier", "name": "National Oceanic and Atmospheric Administration", "toptier_name": "Department of Commerce"}), ("national_institute_of_standards_and_technology", {"type": "awarding", "tier": "subtier", "name": "National Institute of Standards and Technology", "toptier_name": "Department of Commerce"}), ("u_s_geological_survey", {"type": "awarding", "tier": "subtier", "name": "U.S. Geological Survey", "toptier_name": "Department of the Interior"}), ("agency_for_healthcare_research_and_quality", {"type": "awarding", "tier": "subtier", "name": "Agency for Healthcare Research and Quality", "toptier_name": "Department of Health and Human Services"}), ("national_institute_of_food_and_agriculture", {"type": "awarding", "tier": "subtier", "name": "National Institute of Food and Agriculture", "toptier_name": "Department of Agriculture"})]
          for slug, ag in AG:
              body = {"group": "fiscal_year", "filters": {"award_type_codes": ["02", "03", "04", "05"], "time_period": [{"start_date": "2008-10-01", "end_date": "2025-09-30"}]}}
              if ag: body["filters"]["agencies"] = [ag]
              r = b""
              for a in range(4):
                  try:
                      req = urllib.request.Request("https://api.usaspending.gov/api/v2/search/spending_over_time/", data=json.dumps(body).encode(), headers=UA)
                      r = urllib.request.urlopen(req, timeout=180).read(); break
                  except Exception as e:
                      log.write("%s attempt %d %r\n" % (slug, a, e)); log.flush(); time.sleep(15 * (a + 1))
              open("out/usaspending_%s.json" % slug, "wb").write(r)
              log.write("%s len=%d\n" % (slug, len(r))); log.flush(); time.sleep(3)
          PY
          python3 q.py
          cat out/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usaspending-agencies2
          path: out/

