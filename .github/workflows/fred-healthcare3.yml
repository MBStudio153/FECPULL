name: fred-healthprice3
on: workflow_dispatch
permissions:
  contents: read
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - name: FRED API, BEA personal consumption expenditure price indexes for health care (physicians, dental, hospitals, drugs, insurance), plus ID searches
        run: |
          mkdir -p out
          cat > q.py <<'PY'
          import json, os, time, urllib.parse, urllib.request
          fk = os.environ["FRED_API_KEY"]
          log = open("out/log.txt", "w")
          if not fk: log.write("FRED_API_KEY secret is empty\n"); log.flush()
          def get(path, **q):
              q.update(api_key=fk, file_type="json")
              url = "https://api.stlouisfed.org/fred/" + path + "?" + urllib.parse.urlencode(q)
              for a in range(3):
                  try:
                      return urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "kaim-research/1.0"}), timeout=120).read().decode()
                  except Exception as e:
                      log.write("%s %s attempt %d %r\n" % (path, q.get("series_id") or q.get("search_text"), a, e)); log.flush(); time.sleep(4)
              return None
          # candidates; every ID that works is saved, so a wrong guess costs nothing
          ids = [
              "DHSPRG3A086NBEA", "DNRSRG3A086NBEA", "DHPNRG3A086NBEA", "DHHCRG3A086NBEA",   # hospitals, nursing homes, hospital and nursing home, home health care
              "DOUTRG3A086NBEA", "DPMSRG3A086NBEA", "DMLBRG3A086NBEA", "DOMDRG3A086NBEA",   # outpatient, paramedical, medical laboratories, other professional medical services
              "DHLCRG3Q086SBEA", "DHLCRV1A225NBEA",                                        # health care price index quarterly, annual percent change
          ]
          for sid in ids:
              txt = get("series/observations", series_id=sid)
              meta = get("series", series_id=sid)
              if txt:
                  open("out/fred_%s.json" % sid, "w").write(txt)
                  title = units = ""
                  try:
                      m = json.loads(meta)["seriess"][0]; title = m["title"]; units = m.get("units_short", "")
                  except Exception: pass
                  obs = [o for o in json.loads(txt)["observations"] if o["value"] != "."]
                  log.write("OK   %s  %d obs  %s to %s  %s  [%s]\n" % (sid, len(obs), obs[0]["date"] if obs else "-", obs[-1]["date"] if obs else "-", title, units)); log.flush()
              else:
                  log.write("FAIL %s\n" % sid); log.flush()
          log.close()
          PY
          python3 q.py
          grep -E "^(OK|FAIL)" out/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fred-healthprice3
          path: out/
          retention-days: 3

