name: nass-pigcrop-api1
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        species: [HOGS]
    steps:
      - name: NASS Quick Stats API, national pig crop rows for one species
        env:
          NASS_KEY: ${{ secrets.NASS_API_KEY }}
          SPECIES: ${{ matrix.species }}
        run: |
          mkdir -p out
          cat > q.py <<'PY'
          import collections, json, os, time, urllib.parse, urllib.request
          key = os.environ["NASS_KEY"]; sp = os.environ["SPECIES"]
          log = open("out/log.txt", "w"); rows = []; seen = set()
          def call(ep, q):
              url = "https://quickstats.nass.usda.gov/api/%s/?" % ep + urllib.parse.urlencode(q)
              for a in range(3):
                  try:
                      return json.loads(urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "kaim-research/1.0"}), timeout=120).read().decode())
                  except Exception as e:
                      log.write("%s attempt %d %r\n" % (ep, a, e)); log.flush(); time.sleep(6)
              return None
          for agg in ("NATIONAL",):
              for y0, y1 in ((1980, 1999), (2000, 2014), (2015, 2026)):
                  q = {"key": key, "commodity_desc": sp, "statisticcat_desc": "PIG CROP", "agg_level_desc": agg,
                       "year__GE": str(y0), "year__LE": str(y1), "format": "JSON"}
                  d = call("api_GET", q); data = (d or {}).get("data", [])
                  for r in data:
                      k = (r.get("short_desc"), r.get("year"), r.get("state_alpha"), r.get("agg_level_desc"), r.get("reference_period_desc"), r.get("domaincat_desc"), r.get("Value"))
                      if k not in seen: seen.add(k); rows.append(r)
                  log.write("%s %d-%d: %d rows (%r)\n" % (agg, y0, y1, len(data), None if d else "failed")); log.flush()
                  time.sleep(1)
          json.dump(rows, open("out/nass_%s_pigcrop.json" % sp.lower(), "w"))
          log.write("total %d unique rows\n" % len(rows))
          for k, v in collections.Counter((r.get("short_desc"), r.get("agg_level_desc"), r.get("reference_period_desc")) for r in rows).most_common(80): log.write("%6d  %s\n" % (v, k))
          PY
          python3 q.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nass-pigcrop-${{ matrix.species }}
          path: out/

