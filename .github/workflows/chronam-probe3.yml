name: chronam-probe3
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        years: ["1795,1815", "1835,1855", "1875,1889"]
    steps:
      - name: Fetch page text for market-column hits and extract price lines
        env:
          YEARS_: ${{ matrix.years }}
        run: |
          mkdir -p out
          cat > q.py <<'PY'
          import os, re, json, time, urllib.request, urllib.parse
          log = open("out/log.txt", "w")
          def L(s): log.write(s + "\n"); log.flush()
          def get(url, tries=4):
              for a in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "KAIM-Research-probe (info@kaimresearch.com)"})
                      return urllib.request.urlopen(req, timeout=90).read().decode("utf-8", "replace")
                  except Exception as e:
                      L("  retry %d %r" % (a, str(e)[:80])); time.sleep(90)
              return None
          PRICE = re.compile(r"(bread|flour|milk|wheat|salt)[^\\n]{0,80}?(\\$\\s?\\d[\\d.,]*|\\d+\\s?(cents?|cts?|d\\b|s\\b|shillings?|dollars?))", re.I)
          out = []
          for y in [int(x) for x in os.environ["YEARS_"].split(",")]:
              for q in ["prices current flour wheat salt", "price of flour barrel", "price of salt bushel", "assize of bread"]:
                  url = "https://www.loc.gov/collections/chronicling-america/?" + urllib.parse.urlencode({"q": q, "dates": "%d/%d" % (y, y), "fo": "json", "c": 4})
                  r = get(url); time.sleep(30)
                  if not r: continue
                  try: d = json.loads(r)
                  except Exception: L("%d %s non-json %r" % (y, q, r[:100])); continue
                  res = d.get("results", [])
                  L("%d %s total=%s keys=%s" % (y, q, d.get("pagination", {}).get("total"), sorted(res[0].keys())[:40] if res else None))
                  for it in res[:3]:
                      rid = it.get("id"); L("  hit %s %s" % (it.get("date"), rid))
                      ft = it.get("full_text") or ""
                      src = "search result"
                      if not ft and rid:
                          t = get(rid + ("&" if "?" in rid else "?") + "fo=json"); time.sleep(30)
                          if t:
                              try:
                                  j = json.loads(t); L("  item keys: %s" % sorted(j.keys())[:30]); src = "item json"
                                  ft = j.get("full_text") or (j.get("item") or {}).get("full_text") or json.dumps(j)[:0]
                                  rs = j.get("resource") or {}
                                  L("  resource keys: %s" % sorted(rs.keys())[:30])
                                  ft = ft or rs.get("fulltext_file") or ""
                              except Exception as e: L("  item parse %r" % e)
                      lines = [m.group(0)[:200] for m in PRICE.finditer(ft)] if ft else []
                      L("  text via %s: %d chars, %d price lines" % (src, len(ft), len(lines)))
                      out.append({"year": y, "query": q, "date": it.get("date"), "id": rid, "title": it.get("title"), "chars": len(ft), "price_lines": lines[:25], "sample": ft[:300]})
          json.dump(out, open("out/probe2.json", "w"), indent=1)
          PY
          python3 q.py || true
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronam-probe3-${{ strategy.job-index }}
          path: out/

