# idmap_pull_v2.yml - ONE-FILE workflow: re-run of the identifier map for the 96 companies v1 could not resolve.
# Save it in your repo as:  .github/workflows/idmap_pull_v2.yml
# Then: Actions tab > "ID map pull v2" > Run workflow. No inputs and no other files needed.
#
# Six small jobs start at the same time (16 companies each) and finish in roughly 15 minutes.
# Download "id-map-v2" (id_map.csv with a new "method" column, id_all_figi.csv for review, logs).
# Optional: add a free OpenFIGI API key as a repository secret named OPENFIGI_KEY to run faster.
# Works without it.

name: ID map pull v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write script and company list
        run: |
          mkdir -p idmap
          cat > idmap/idmap_pull_v2.py <<'PYEOF'
          #!/usr/bin/env python3
          """
          idmap_pull_v2.py - re-run of the identifier map for companies v1 could not resolve (LEI -> ISIN -> ticker).

          Standard library only. Free public sources:
            GLEIF  (api.gleif.org)      legal name, jurisdiction, and ISINs linked to each LEI (coverage is incomplete)
            OpenFIGI (api.openfigi.com) ISIN -> ticker, exchange, FIGI (mapping); company name -> listings (search)
          Optional: set env OPENFIGI_KEY (free key from openfigi.com) for faster rate limits. Works without it.

          Changes from v1:
            1. ISINs are ordered with home prefixes first (filing country, GLEIF legal jurisdiction, headquarters country), cap 40.
            2. Rows that are rights, interim/new-share lines (-RTS, -BTA, -NV24), ADR/GDR/unsponsored lines or bonds are rejected
               as the main security.
            3. Fallback when GLEIF has no usable ISIN: OpenFIGI name search for the Common Stock on the home exchange.
               Such rows get method = name_search, an empty ISIN, and a note; they are matched on name similarity (>= 0.5).

          Usage: python idmap_pull_v2.py --leis leis_fix.csv --chunk 1 --of 6 --out out
          Output per chunk: id_map_<n>.csv (same columns as v1 plus method), id_all_figi_<n>.csv, idmap_<n>_log.txt
          """
          import argparse, csv, json, os, re, sys, time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote

          UA = "KAIM-Research-ID-map (research use)"
          KEY = os.environ.get("OPENFIGI_KEY", "").strip()
          HOME_EXCH = {"FR": "FP", "SE": "SS", "GB": "LN", "NL": "NA", "DK": "DC", "FI": "FH", "NO": "NO", "BE": "BB", "AT": "AV",
                       "IT": "IM", "ES": "SM", "GR": "GA", "PL": "PW", "HU": "HB", "IS": "IR", "LU": "LX", "DE": "GR", "IE": "ID"}
          FIELDS = ["lei", "country", "name", "gleif_name", "isin", "ticker", "exch_code", "figi", "security_type", "name_figi",
                    "confidence", "n_isins", "n_checked", "notes", "method"]
          BAD = re.compile(r"(-RTS|-BTA|-NV\d|-NR|-UNSP|-SPON|\bADR\b|\bGDR\b|\bDRIP\b|-RIGHTS|\bRTS\b|\bPRF\b|\bPREF)", re.I)
          SUFFIX = re.compile(r"\b(a/s|aps|ab|abp|asa|as|oyj|oy|plc|ltd|limited|nv|n\.v\.|se|sa|s\.a\.|spa|s\.p\.a\.|ag|gmbh|kgaa|holding|holdings|group|"
                              r"aktiebolag|aktiengesellschaft|publ|nyilvanosan|mukodo|rt|corp|corporation|company|co|the|inc|hf|bv|b\.v\.)\b", re.I)


          def http(url, log, data=None, tries=5, headers=None):
              delay = 3.0
              for i in range(tries):
                  try:
                      h = {"User-Agent": UA, "Accept": "application/json"}
                      if data is not None:
                          h["Content-Type"] = "application/json"
                      if KEY and "openfigi" in url:
                          h["X-OPENFIGI-APIKEY"] = KEY
                      if headers:
                          h.update(headers)
                      with urlopen(Request(url, data=data, headers=h), timeout=90) as r:
                          return json.loads(r.read())
                  except HTTPError as e:
                      log.write("HTTP %s %s\n" % (e.code, url[:140]))
                      if e.code in (400, 404):
                          return None
                      if e.code == 429:
                          time.sleep(max(delay, 30)); delay *= 2; continue
                  except (URLError, TimeoutError, ConnectionError, ValueError) as e:
                      log.write("ERR %s %s\n" % (e, url[:140]))
                  time.sleep(delay); delay *= 2
              return None


          def gleif(lei, log, max_isins):
              rec = http("https://api.gleif.org/api/v1/lei-records/%s" % quote(lei), log)
              name, countries = "", []
              if rec and rec.get("data"):
                  ent = (rec["data"].get("attributes") or {}).get("entity") or {}
                  name = (ent.get("legalName") or {}).get("name", "")
                  for k in ("jurisdiction", "legalAddress", "headquartersAddress"):
                      v = ent.get(k)
                      c = (v.get("country") if isinstance(v, dict) else v) or ""
                      if c: countries.append(str(c)[:2].upper())
              isins, page = [], 1
              while True:
                  d = http("https://api.gleif.org/api/v1/lei-records/%s/isins?page%%5Bsize%%5D=200&page%%5Bnumber%%5D=%d" % (quote(lei), page), log)
                  if not d or not d.get("data"):
                      break
                  isins += [x["attributes"]["isin"] for x in d["data"] if x.get("attributes", {}).get("isin")]
                  last = ((d.get("meta") or {}).get("pagination") or {}).get("lastPage", 1)
                  if page >= last or len(isins) >= 1000:
                      break
                  page += 1
                  time.sleep(1.1)
              return name, countries, isins


          def order_isins(isins, prefixes):
              seen, out = set(), []
              for p in prefixes:
                  for i in isins:
                      if i[:2] == p and i not in seen:
                          seen.add(i); out.append(i)
              return out + [i for i in isins if i not in seen]


          def parse_figi(resp, isins):
              rows = []
              for isin, item in zip(isins, resp or []):
                  for d in (item or {}).get("data", []) or []:
                      rows.append({"isin": isin, "ticker": d.get("ticker", ""), "exch_code": d.get("exchCode", ""), "figi": d.get("figi", ""),
                                   "security_type": d.get("securityType2") or d.get("securityType", ""), "name_figi": d.get("name", "")})
              return rows


          def figi(isins, log):
              out, step = [], (100 if KEY else 10)
              for i in range(0, len(isins), step):
                  part = isins[i:i + step]
                  resp = http("https://api.openfigi.com/v3/mapping", log, data=json.dumps([{"idType": "ID_ISIN", "idValue": x} for x in part]).encode())
                  out += parse_figi(resp, part)
                  time.sleep(0.8 if KEY else 2.6)
              return out


          def good(r):
              return r["security_type"] == "Common Stock" and not BAD.search(r["name_figi"] or "")


          def choose(rows, home_prefixes, country):
              cs = [r for r in rows if good(r)]
              home = HOME_EXCH.get(country, "")
              for r in cs:
                  if r["exch_code"] == home and r["isin"][:2] in home_prefixes:
                      return r, "high"
              for r in cs:
                  if r["exch_code"] == home:
                      return r, "high"
              if cs:
                  return cs[0], "medium"
              return None, ""


          def clean(n):
              n = re.sub(r"[^\w\s/]", " ", (n or "").lower().replace("&", " and "))
              n = SUFFIX.sub(" ", n)
              return [t for t in n.replace("/", " ").split() if len(t) > 1 and t not in ("shs", "share", "shares", "class", "ser", "series", "reg", "ord")]


          def score(a, b):
              A, B = set(clean(a)), set(clean(b))
              return len(A & B) / len(A | B) if A and B else 0.0


          def name_search(names, country, log):
              """Return (row, confidence) from OpenFIGI search by name; None when nothing similar enough."""
              home = HOME_EXCH.get(country, "")
              pause = 3.0 if KEY else 13.0
              for exch, conf, floor in ((home, "medium", 0.5), ("", "low", 0.6)):
                  for q in names:
                      if not q:
                          continue
                      body = {"query": q, "securityType2": "Common Stock"}
                      if exch:
                          body["exchCode"] = exch
                      d = http("https://api.openfigi.com/v3/search", log, data=json.dumps(body).encode())
                      time.sleep(pause)
                      best = None
                      for x in (d or {}).get("data", []) or []:
                          row = {"isin": "", "ticker": x.get("ticker", ""), "exch_code": x.get("exchCode", ""), "figi": x.get("figi", ""),
                                 "security_type": x.get("securityType2") or x.get("securityType", ""), "name_figi": x.get("name", "")}
                          if not good(row):
                              continue
                          s = score(q, row["name_figi"])
                          if s >= floor and (best is None or s > best[0]):
                              best = (s, row)
                      if best:
                          return best[1], conf, best[0]
              return None, "", 0.0


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--leis", required=True); ap.add_argument("--chunk", type=int, default=1); ap.add_argument("--of", type=int, default=1)
              ap.add_argument("--out", default="idmap_out"); ap.add_argument("--max-isins", type=int, default=40)
              a = ap.parse_args()
              os.makedirs(a.out, exist_ok=True)
              todo = list(csv.DictReader(open(a.leis, encoding="utf-8")))
              todo = [r for i, r in enumerate(todo) if i % a.of == a.chunk - 1]
              log = open(os.path.join(a.out, "idmap_%d_log.txt" % a.chunk), "w")
              fo = open(os.path.join(a.out, "id_map_%d.csv" % a.chunk), "w", newline="", encoding="utf-8")
              fa = open(os.path.join(a.out, "id_all_figi_%d.csv" % a.chunk), "w", newline="", encoding="utf-8")
              w = csv.DictWriter(fo, fieldnames=FIELDS); w.writeheader()
              wa = csv.DictWriter(fa, fieldnames=["lei", "isin", "ticker", "exch_code", "figi", "security_type", "name_figi"]); wa.writeheader()
              for n, r in enumerate(todo, 1):
                  lei, ctry = r["lei"], r["country"]
                  gname, gcountries, isins = gleif(lei, log, a.max_isins)
                  prefixes = []
                  for p in [ctry] + gcountries:
                      if p and p not in prefixes: prefixes.append(p)
                  ordered = order_isins(isins, prefixes)[: a.max_isins]
                  rows = figi(ordered, log) if ordered else []
                  for x in rows:
                      wa.writerow({"lei": lei, **x})
                  pick, conf = choose(rows, prefixes, ctry)
                  method, notes = "gleif_isin", []
                  if not isins: notes.append("no ISIN on GLEIF")
                  if len(isins) > a.max_isins: notes.append("ISINs checked: %d of %d, home prefixes first" % (a.max_isins, len(isins)))
                  if isins and not rows: notes.append("ISINs found but no FIGI match")
                  if pick is None:
                      pick, conf, sc = name_search([r["name"], gname], ctry, log)
                      if pick:
                          method = "name_search"
                          notes.append("matched by name (similarity %.2f), ISIN not available from GLEIF; verify before use" % sc)
                          wa.writerow({"lei": lei, **pick})
                      else:
                          method = ""
                          notes.append("no listed common stock found")
                  w.writerow({"lei": lei, "country": ctry, "name": r["name"], "gleif_name": gname,
                              "isin": pick["isin"] if pick else "", "ticker": pick["ticker"] if pick else "",
                              "exch_code": pick["exch_code"] if pick else "", "figi": pick["figi"] if pick else "",
                              "security_type": pick["security_type"] if pick else "", "name_figi": pick["name_figi"] if pick else "",
                              "confidence": conf, "n_isins": len(isins), "n_checked": len(ordered), "notes": "; ".join(notes), "method": method})
                  fo.flush(); fa.flush()
                  if n % 5 == 0:
                      print("chunk %d: %d/%d" % (a.chunk, n, len(todo)), flush=True)
              print("chunk %d done: %d companies" % (a.chunk, len(todo)))


          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
