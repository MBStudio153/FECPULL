name: conquest-autocracy1
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Regimes of the World (V-Dem) by country, plus World Bank population
        run: |
          mkdir -p out
          cat > q.py <<'PY'
          import time, urllib.request, json
          UA = {"User-Agent": "kaim-research/1.0"}
          log = open("out/log.txt", "w")
          U = {
            # V-Dem Regimes of the World, 0 closed autocracy, 1 electoral autocracy, 2 electoral democracy, 3 liberal democracy (via Our World in Data; V-Dem CC BY-SA 4.0)
            "regime_owid.csv": "https://ourworldindata.org/grapher/political-regime.csv?v=1&csvType=full&useColumnShortNames=true",
            "regime_owid_metadata.json": "https://ourworldindata.org/grapher/political-regime.metadata.json?v=1&csvType=full&useColumnShortNames=true",
            "pop_in_regimes_owid.csv": "https://ourworldindata.org/grapher/population-living-in-democracies-autocracies.csv?v=1&csvType=full&useColumnShortNames=true",
            "wdi_population.json": "https://api.worldbank.org/v2/country/all/indicator/SP.POP.TOTL?format=json&per_page=20000&date=1960:2025",
            "wdi_countries.json": "https://api.worldbank.org/v2/country?format=json&per_page=400",
            "vdem_page.html": "https://www.v-dem.net/data/the-v-dem-dataset/",
            "vdem_faq.html": "https://www.v-dem.net/about/faq/",
          }
          for fn, u in U.items():
              for a in range(4):
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=180).read()
                      open("out/" + fn, "wb").write(r)
                      log.write("%s ok %d bytes\n" % (fn, len(r))); break
                  except Exception as e:
                      log.write("%s attempt %d %s\n" % (fn, a, repr(e)[:120])); time.sleep(10 * (a + 1))
              log.flush(); time.sleep(2)
          PY
          python3 q.py || true
          ls -la out
          cat out/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conquest-autocracy1
          path: out/

