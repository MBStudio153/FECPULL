name: tariff-data2
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Census imports and duties by country, 2020 to 2025
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          mkdir -p out
          cat > t.py <<'PY'
          import os, time, urllib.parse, urllib.request
          UA = {"User-Agent": "kaim-research/1.0 (info@kaimresearch.com)"}
          B = "https://api.census.gov/data/timeseries/intltrade/imports/hs"
          log = open("out/log.txt", "w")
          key = os.environ.get("CENSUS_API_KEY", "")
          def get(url, tries=4):
              err = ""
              for a in range(tries):
                  try:
                      return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=180).read().decode("utf-8", "replace")
                  except Exception as e:
                      err = repr(e)[:150]; time.sleep(8 * (a + 1))
              return "ERROR " + err
          def save(name, p):
              if key: p["key"] = key
              r = get(B + "?" + urllib.parse.urlencode(p))
              open("out/" + name, "w").write(r)
              log.write("%s len=%d %s\n" % (name, len(r), r[:70].replace("\n", " "))); log.flush(); time.sleep(2)
          for yr in range(2020, 2026):
              save("annual_%d.json" % yr, {"get": "CTY_CODE,CTY_NAME,GEN_VAL_YR,CON_VAL_YR,CAL_DUT_YR,I_COMMODITY,I_COMMODITY_LDESC", "COMM_LVL": "HS2", "time": "%d-12" % yr})
          PY
          python3 t.py
          tail -15 out/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tariff-data2
          path: out/

