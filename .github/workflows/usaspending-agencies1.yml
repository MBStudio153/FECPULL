name: usaspending-agencies1
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: USAspending grant dollars by year, all federal and five agencies
        run: |
          mkdir -p out
          cat > q.py <<'PY'
          import json, time, urllib.request
          UA = {"User-Agent": "kaim-research/1.0", "Content-Type": "application/json"}
          log = open("out/log.txt", "w")
          AG = [("all_federal", None), ("department_of_energy", {"type": "awarding", "tier": "toptier", "name": "Department of Energy"}), ("national_aeronautics_and_space_administration", {"type": "awarding", "tier": "toptier", "name": "National Aeronautics and Space Administration"}), ("department_of_agriculture", {"type": "awarding", "tier": "toptier", "name": "Department of Agriculture"}), ("department_of_defense", {"type": "awarding", "tier": "toptier", "name": "Department of Defense"}), ("department_of_veterans_affairs", {"type": "awarding", "tier": "toptier", "name": "Department of Veterans Affairs"})]
          for slug, ag in AG:
              body = {"group": "fiscal_year", "filters": {"award_type_codes": ["02", "03", "04", "05"], "time_period": [{"start_date": "2008-10-01", "end_date": "2025-09-30"}]}}
              if ag: body["filters"]["agencies"] = [ag]
              r = b""
              for a in range(4):
                  try:
                      req = urllib.request.Request("https://api.usaspending.gov/api/v2/search/spending_over_time/", data=json.dumps(body).encode(), headers=UA)
                      r = urllib.request.urlopen(req, timeout=180).read(); break
                  except Exception as e:
                      log.write("%s attempt %d %r\n" % (slug, a, e)); log.flush(); time.sleep(15 * (a + 1))
              open("out/usaspending_%s.json" % slug, "wb").write(r)
              log.write("%s in len=%d\n" % (slug, len(r))); log.flush(); time.sleep(3)
          PY
          python3 q.py
          cat out/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usaspending-agencies1
          path: out/

